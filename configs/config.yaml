data:
  annotations_file: "data/isic-2024-challenge/train-metadata.csv"
  img_dir: "data/isic-2024-challenge/train-image/image"
  img_size: [224, 224]
  batch_size: 64
  num_workers: 4
  val_split: 0.2
  file_ext: ".jpg"

model:
  architecture: "resnet50"
  pretrained: true
  freeze_backbone: false
  num_classes: 7
  dropout_rate: 0.3

training:
  epochs: 20
  learning_rate: 0.001
  weight_decay: 0.00001
  lr_scheduler:
    factor: 0.1
    patience: 5
  early_stopping:
    patience: 10
    min_delta: 0.001

paths:
  checkpoint_dir: "checkpoints/"
  log_dir: "logs/"

hpc:
  gradient_accumulation_steps: 1
  mixed_precision: true
